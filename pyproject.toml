[project]
name = "finnegans-mcp"
version = "1.0.0"
description = "Extension de Claude Desktop para consultar y modificar Finnegans"
requires-python = ">=3.12"
dependencies = [
    "mcp>=2.3,<3",
    "duckdb>=2.0,<3",
    "openpyxl>=3.1",
    "pytz>=2026.6",
]

[dependency-groups]
dev = ["pytest"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/finnegans_core", "src/finnegans_mcp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--import-mode=importlib"
